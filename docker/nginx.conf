worker_processes 1;
pid /tmp/nginx.pid;
# Request diagnostics may include untrusted URLs; health checks supply readiness.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    # nginx initializes these module paths even without FastCGI/uWSGI/SCGI routes.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker DNS must refresh upstream addresses after app container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream camenae {
        zone camenae 64k;
        # Docker DNS can return SERVFAIL while app is absent. The cache lifetime
        # above does not bound that error's retry delay (30 seconds by default).
        resolver_timeout 2s;
        server app:3000 resolve;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://camenae;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 3s;
        }
    }
}
