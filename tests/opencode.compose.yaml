services:
  app:
    environment:
      CAMENAE_OPENCODE_CONSOLE_FREE: "false"
  opencode-worker:
    environment:
      CAMENAE_OPENCODE_CONFIG: /app/tests/opencode.config.json
      CAMENAE_OPENCODE_CONSOLE_FREE: "false"
    networks:
      inference:
        ipv4_address: ${CAMENAE_INFERENCE_PREFIX}.5
  opencode-fixture:
    image: camenae-test-opencode-fixture:latest
    build:
      labels:
        app.camenae.test-image: "true"
      context: .
      dockerfile: docker/application.Dockerfile
    command: [bun, tests/opencode-upstream.ts]
    networks:
      inference:
        ipv4_address: ${CAMENAE_INFERENCE_PREFIX}.6
