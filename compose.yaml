# Legacy deployment identity: retain existing volume/network names until an explicit migration.
# The product name is Camenae.
name: bob-camenae

services:
  ingress:
    build:
      context: .
      dockerfile: docker/ingress.Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    ports:
      - "127.0.0.1:${CAMENAE_HTTP_PORT:-3000}:8080"
    networks: [frontend, backend]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: camenae
      POSTGRES_USER: camenae
      POSTGRES_PASSWORD: ${CAMENAE_DATABASE_PASSWORD:?Run bun run dev:init first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U camenae -d camenae"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/application.Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 20s
    environment:
      CAMENAE_HOST: 0.0.0.0
      CAMENAE_PORT: "3000"
      CAMENAE_DATA_DIRECTORY: /data
      CAMENAE_DATABASE_HOST: postgres
      CAMENAE_DATABASE_NAME: camenae
      CAMENAE_DATABASE_USER: camenae
      CAMENAE_DATABASE_PASSWORD: ${CAMENAE_DATABASE_PASSWORD:?Run bun run dev:init first}
      CAMENAE_ORIGIN: ${CAMENAE_ORIGIN:-http://127.0.0.1:3000}
      CAMENAE_CREDENTIALS_FILE: /run/secrets/local_auth
      CAMENAE_MCP_HOST: ${CAMENAE_INFERENCE_PREFIX:-172.30.83}.3
      HTTPS_PROXY: http://${CAMENAE_INFERENCE_PREFIX:-172.30.83}.2:3128
    secrets: [local_auth]
    volumes:
      - workspace:/data/workspace
      - bob-state:/data/bob-state
      - bob-ipc:/run/bob:ro
      - mcp-config:/run/camenae-mcp
    tmpfs:
      - /data/tmp:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    networks:
      backend: {}
      inference:
        ipv4_address: ${CAMENAE_INFERENCE_PREFIX:-172.30.83}.3
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/application.Dockerfile
    command: [bun, src/worker.ts]
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 20s
    networks: [inference]
    dns: [127.0.0.1]
    environment:
      CAMENAE_DATA_DIRECTORY: /data
      HTTPS_PROXY: http://${CAMENAE_INFERENCE_PREFIX:-172.30.83}.2:3128
    volumes:
      - workspace:/data/workspace
      - bob-state:/data/bob-state
      - bob-ipc:/run/bob
      - mcp-config:/run/camenae-mcp:ro
    tmpfs:
      - /data/tmp:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: [CMD-SHELL, "test -S /run/bob/gateway.sock"]
      interval: 2s
      timeout: 3s
      retries: 20

  egress:
    build:
      context: .
      dockerfile: docker/egress.Dockerfile
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: "0"
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/tmp]
    environment:
      CAMENAE_GATE_IP: ${CAMENAE_INFERENCE_PREFIX:-172.30.83}.3
    networks:
      inference:
        ipv4_address: ${CAMENAE_INFERENCE_PREFIX:-172.30.83}.2
      outbound: {}

volumes:
  postgres-data:
  workspace:
  bob-state:
  mcp-config:
  bob-ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=0700

networks:
  outbound:
  inference:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: ${CAMENAE_INFERENCE_PREFIX:-172.30.83}.0/24
  frontend:
  backend:
    internal: true

secrets:
  local_auth:
    file: ${CAMENAE_AUTH_FILE:-.cache/local-auth/credentials.json}
